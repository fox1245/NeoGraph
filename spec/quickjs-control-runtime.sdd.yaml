phases:
  Q0_dependency_qualification:
    deliver:
      - exact release and source digest
      - license and provenance record
      - optional default-off build integration
      - platform/static/shared/installed-consumer evidence
      - sanitizer, binary-size, startup, and allocation evidence
    gate: QuickJS is absent from the disabled Core consumer and all dependency evidence is accepted.
  Q1_authoring_and_admission:
    deliver:
      - owned JavaScript source with define and main profiles
      - bounded dispatch-free graph definition context
      - sealed typed graph builder and canonical strict Core lowering
      - sealed module resolver
      - restricted contexts
      - exact Core and Program bundle identity
      - stable syntax, graph-validation, and source-map diagnostics
    gate: Valid graph and Program source seal immutably and every invalid class dispatches zero work.
  Q2_command_execution:
    deliver:
      - canonical command schema
      - sealed ng module constructors
      - import-slot resolution
      - generator resume with typed outcomes
      - C++ ProgramRuntime join handler
      - ng.parallel, ng.race, and ng.quorum lowering to join
      - bounded JavaScript map-to-command construction with C++ max_in_flight enforcement
    gate: >-
      Representative control programs invoke only admitted Core and host
      bindings, structured groups run with actual C++ concurrency, and every
      rejected group dispatches zero members.
  Q3_metering_and_isolation:
    deliver:
      - memory ceiling
      - interrupt quantum
      - nonrenewable budget accounting
      - cancellation propagation
      - hostile-source isolation corpus
    gate: Infinite or hostile programs terminate without forbidden access or late dispatch.
  Q4_replay_and_recovery:
    deliver:
      - command journal coordinates
      - deterministic source replay
      - mismatch failure
      - pending-head recovery
      - canonical explicit checkpoint state
      - durable join group and member coordinates
      - winner, quorum, cancellation, and drain recovery
    gate: >-
      Crash injection at every command and join publication boundary loses or
      duplicates no command, group member, child, or external effect.
  Q5_native_abi:
    deliver:
      - versioned C ABI
      - C++ wrapper
      - existing registry integration
      - ownership/cancellation/destruction conformance
    gate: Supported native plugins pass static/shared/compiler boundary tests.
  Q6_authoring_cutover:
    deliver:
      - JavaScript public Core graph and Program authoring
      - Harness and direct publication convergence
      - stored Core definition and Program version classification
      - legacy publication rejection diagnostics
    gate: Every new authored source is JavaScript and no adapter silently selects legacy semantics.
  Q7_legacy_removal:
    deliver:
      - final stored-definition and stored-version drain proof
      - Core DSL elaborator and Program schema/parser/dispatcher deletion
      - compatibility dependency removal
      - full graph-equivalence, migration, replay, sanitizer, consumer, and performance evidence
    gate: One source authoring language, one canonical Core IR, and one durable effect model remain.

