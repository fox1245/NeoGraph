blocking_invariants:
  one_node_executor:
    statement: GraphEngine remains the only executor of Core/application nodes.
    proof:
      - QuickJS yields commands and never owns GraphNode readiness or Core checkpoints
      - ProgramRuntime validates and dispatches pinned Core invocations
      - direct Core and JavaScript-wrapped Core equivalence tests cover shared behavior
  core_optional_program:
    statement: Core-only users pay no QuickJS dependency, symbol, allocation, branch, or binary-size cost.
    proof:
      - NEOGRAPH_BUILD_PROGRAM=OFF installed-consumer build and run
      - QuickJS absent from the Core link interface and transitive package metadata
      - enabled-but-unused and disabled Core benchmark comparison
  stable_program_performance:
    statement: >-
      The fixed QuickJS-to-command-to-ProgramRuntime path remains within
      preregistered cold and warm regression thresholds.
    proof:
      - representative workloads and thresholds are fixed before optimization
      - repeated distributions cover runtime creation, compilation, first command, warm command, hostcall, replay growth, allocation, and concurrency
      - framework overhead is isolated from GraphEngine, provider, tool, journal, and persistence time
      - direct Core and JavaScript-wrapped Core are reported separately
  one_authoring_language:
    statement: JavaScript is the sole source authoring language after cutover.
    proof:
      - no new bounded Core DSL definitions after the freeze
      - no new Program JSON operation versions after the freeze
      - Lua and Janet are not public source kinds or runtime modes
      - Harness Core and Program publication resolve to JavaScript profiles
      - strict Core JSON remains validated interchange rather than a programming language
  no_language_reinvention:
    statement: NeoGraph does not define a second expression, function, scope, loop, exception, class, module, or macro language.
    proof:
      - no ng.if, ng.loop, ng.map, or custom JavaScript syntax
      - new domain behavior enters through a versioned host binding
      - ordinary computation uses standard JavaScript semantics
  host_owned_structured_concurrency:
    statement: >-
      Actual parallel, race, quorum, and bounded fan-out are C++ ProgramRuntime
      scheduling semantics. QuickJS and JavaScript Promise machinery never own
      external concurrency, child lifecycle, or join completion.
    proof:
      - ng.parallel, ng.race, and ng.quorum lower to one typed join command
      - standard JavaScript array mapping constructs member descriptors without dispatch
      - QuickJS command constructors and native bindings perform zero dispatch and never block
      - ProgramRuntime validates the complete group and reserves admitted budget before launching new work
      - C++ scheduling enforces max_in_flight, failure policy, output bounds, deterministic ordering, cancellation, and drain
      - race ties use declaration order and every loser observes cancellation before the join completes
      - quorum launches admitted members concurrently and reports a stable unreachable outcome
      - multi-step concurrent branches use pinned child Programs rather than concurrent callbacks into one QuickJS context
      - crash and replay fixtures preserve each member identity and never repeat a completed effect
  no_raw_execution:
    statement: Raw or unadmitted JavaScript and modules perform zero dispatch.
    proof:
      - syntax, module, entry-point, schema, binding, policy, and budget rejection fixtures
      - dispatch counters remain zero for every rejected fixture
  closed_host_surface:
    statement: User JavaScript cannot access arbitrary C FFI or ambient host resources.
    proof:
      - allowlisted context excludes QuickJS std and os modules
      - dynamic native modules, files, network, processes, environment, workers, clocks, and random values are unavailable
      - only sealed import slots can yield executable commands
  exact_runtime_identity:
    statement: Every admitted JavaScript source pins the exact runtime, profile, source, module, Core, and native binding semantics.
    proof:
      - QuickJS release, build options, and implementation digest enter Core and Program bundle identity
      - JavaScript profile and ng API versions enter bundle identity
      - mismatch fails before replay or dispatch
  deterministic_recovery:
    statement: Recovery replays source against exact recorded commands and never depends on a raw QuickJS heap snapshot.
    proof:
      - command kind, slot, site, arguments, effect coordinate, and sequence are compared
      - exact history returns recorded results with zero external dispatch
      - mismatch transitions to a stable nondeterminism failure
  nonrenewable_budget:
    statement: Resume, replay, retry, child, fork, and replacement never replenish admitted budget.
    proof:
      - one durable budget ledger remains authoritative
      - replay work is reported separately and cannot increase remaining execution grants
      - crash/restart and concurrent decrement tests
  durable_effect_boundary:
    statement: Native bindings cannot bypass journal, outbox, cancellation, or reconciliation.
    proof:
      - effectful work starts only after a yielded command is durably admitted
      - completion publishes before generator resume
      - completed non-idempotent replay has zero external dispatch
      - ambiguous outcomes block for explicit reconciliation
  stable_native_abi:
    statement: External native extensions use a versioned C ABI; C++ object layouts and exceptions do not cross it.
    proof:
      - ABI/version/ownership/allocator/cancellation/destruction conformance tests
      - C++ wrapper lowers to the same C registration contract
      - semantic version and implementation digest bind every callback
  clean_cutover:
    statement: Compatibility is temporary and no second source compiler or Program runtime remains.
    proof:
      - every stored legacy Core definition and Program version is translated, drain_only, or rejected
      - no new legacy Core or Program publication after the announced boundary
      - Core DSL elaborator and Program parser/dispatcher deleted after the final drain gate

selected_upstream_contract:
  canonical_docs: https://bellard.org/quickjs/quickjs.html
  required_capabilities:
    - C embedding API
    - JS_NewCFunction native bindings
    - JS_SetMemoryLimit allocation ceiling
    - JS_NewRuntime2 custom allocator
    - JS_SetInterruptHandler execution interruption
    - static C module integration
  pinning_rule: >-
    The exact QuickJS release, source digest, license, build options, supported
    platform matrix, and security configuration must be recorded by the
    dependency qualification issue before source integration.
  bytecode_rule: >-
    QuickJS bytecode is an internal cache unless a stable validated storage
    contract is independently proven. Durable authority remains source plus
    exact runtime/compiler identity.

javascript_profile:
  entry_contracts:
    core_definition:
      export: define
      kind: function
      context: bounded_dispatch_free_compile
      output: sealed_typed_graph_builder
    program_control:
      export: main
      kind: generator_function
      input: canonical_json_compatible_value
      output: canonical_json_compatible_value
  contexts:
    definition:
      permits:
        - deterministic_computation
        - sealed_pure_modules
        - sealed_graph_builder
      denies:
        - command_yield
        - program_import_slot_invocation
        - native_host_binding_invocation
        - external_effect
      completion: return_exactly_one_builder_owned_by_the_same_context
    program:
      permits:
        - deterministic_computation
        - sealed_pure_modules
        - ng_command_construction
        - admitted_pure_native_intrinsics
      denies:
        - direct_GraphEngine_execution
        - direct_effect_commit
        - ambient_host_access
      completion: generator_return_or_typed_terminal_failure
  allowed:
    - standard deterministic JavaScript computation
    - closures and generators
    - arrays and plain data objects
    - sealed graph builder composition
    - reviewed sealed pure modules
    - ng command constructors
    - admitted pure native intrinsics
  denied:
    - quickjs_std_module
    - quickjs_os_module
    - dynamic_native_modules
    - arbitrary_ffi
    - ambient_filesystem
    - ambient_network
    - process_and_signal_access
    - environment_access
    - wall_clock
    - unrecorded_random
    - workers_and_shared_memory
    - unsealed_module_resolution
    - planner_selected_credentials_endpoints_providers_or_models
  build_time_disable_when_supported:
    - eval
    - Function_constructor_equivalent_dynamic_compilation
  bridge_rejections:
    - functions
    - symbols
    - cyclic_values
    - live_host_objects
    - raw_pointers
    - values_without_canonical_encoding

graph_definition_protocol:
  source_profile: javascript_profile.entry_contracts.core_definition
  builder:
    representation: opaque_context_owned_host_value
    copyable: false
    serializable_before_seal: false
    usable_after_context_teardown: false
  required_representational_surface:
    - graph_identity_and_entrypoints
    - static_channels_and_reducers
    - registered_nodes_and_configuration
    - edges_and_conditional_edges
    - barriers
    - static_interrupts
    - retry_policy
  mutation_rules:
    - only the owning definition context may mutate an open builder
    - handles from another context, graph, or generation are rejected
    - the first successful return seals the builder permanently
    - exceptions, interruption, limit exhaustion, or validation failure discard the builder
    - definition evaluation cannot dispatch nodes, commands, host bindings, or effects
  preseal_checks:
    - exactly_one_builder_result
    - value_and_handle_ownership
    - registered_node_identity_and_schema
    - channel_port_and_edge_compatibility
    - condition_reducer_barrier_interrupt_and_retry_validity
    - source_coordinate_coverage
    - canonical_size_and_depth_limits
  resource_limits:
    source: admitted_compile_budget_with_nonzero_platform_ceiling
    dimensions:
      - instruction_fuel
      - wall_time
      - runtime_heap_bytes
      - native_builder_bytes
      - stack_depth
      - module_count_and_source_bytes
      - graph_nodes_edges_and_canonical_output_bytes
    exhaustion: stable_compile_limit_failure_with_zero_dispatch
  lowering:
    target: existing_typed_strict_Core_definition
    canonicalization: existing_canonical_Core_rules
    identity_inputs:
      - JavaScript_source_and_module_Merkle_root
      - QuickJS_runtime_compiler_and_profile_identity
      - ng_graph_API_version
      - registry_snapshot_and_executable_receipts
      - canonical_strict_Core_bytes
    output_before_admission:
      - immutable_Core_definition
      - source_map
      - diagnostics
      - capability_and_effect_inputs
  equivalence_gate:
    compare:
      - direct_Cpp_Core_builder
      - legacy_Core_DSL_when_translation_is_claimed
      - JavaScript_define
    require:
      - canonical_Core_equivalence_or_documented_identity_migration
      - observable_GraphEngine_behavior_equivalence
      - stable_diagnostic_and_source_map_expectations
      - zero_dispatch_during_all_definition_evaluation

command_protocol:
  required_fields:
    - protocol_version
    - kind
    - import_slot
    - source_site
    - arguments
  initial_kinds:
    - call_core
    - spawn
    - await
    - join
    - emit
    - checkpoint
    - cancel_scope
    - host_capability
  structured_concurrency:
    canonical_kind: join
    import_slot: sealed_builtin_join_slot_pinned_by_ng_API_version
    execution_owner: Cpp_ProgramRuntime
    quickjs_role: immutable_command_construction_only
    frontend_lowering:
      ng_parallel: join_mode_all
      ng_race: join_mode_race
      ng_quorum: join_mode_quorum
      parallel_map: standard_JavaScript_Array_map_plus_bounded_join
    member_sources:
      - immutable_admitted_deferred_command_descriptors
      - durable_child_handles_owned_or_joinable_by_the_run
    member_rejections:
      - JavaScript_functions_or_closures
      - symbols_or_cyclic_values
      - live_JSValue_or_host_object_references
      - unsealed_imports
      - handles_without_join_authority
    multi_step_branch_rule: use_an_admitted_pinned_child_Program
    modes:
      all:
        result_order: declaration_order
        failure_policies: [fail_fast, collect]
      race:
        winner: first_terminal_member
        same_turn_tie_break: declaration_order
        loser_rule: cancel_and_drain_before_join_completion
      quorum:
        required_successes: positive_integer_not_greater_than_member_count
        scheduling: actual_concurrent_launch_within_max_in_flight
        impossible_outcome: stable_quorum_unreachable_failure
        remainder_rule: cancel_and_drain_when_policy_terminates_the_group
    immutable_bounds:
      - admitted_member_count_ceiling
      - max_in_flight
      - max_output_bytes
      - timeout_when_present
      - admitted_budget_reservation
    pre_dispatch_atomicity:
      - validate_every_member_schema_slot_identity_capability_effect_owner_and_replay_coordinate
      - reserve_all_budget_required_for_new_group_work
      - dispatch_zero_members_when_group_validation_or_reservation_fails
      - existing_child_handles_retain_their_original_budget_and_lineage
    durability:
      - publish_group_and_member_identities_before_dispatch
      - record_each_terminal_member_outcome
      - record_winner_or_quorum_selection_before_generator_resume
      - recover_the_exact_pending_members_after_process_restart
      - replay_completed_members_from_recorded_results_with_zero_external_dispatch
  quickjs_binding_boundary:
    module: sealed_versioned_ng_control_module
    c_function_role: bounded_synchronous_command_construction
    before_yield: no_dispatch_no_wait_no_journal_publication
    at_yield: copy_to_canonical_host_owned_command
    resume: serialized_on_the_owning_QuickJS_executor
    forbidden:
      - blocking_for_Cpp_async_completion_inside_a_QuickJS_callback
      - retaining_JSValue_or_JSContext_borrowed_state_in_async_work
      - resuming_or_calling_one_QuickJS_context_from_worker_threads
      - executing_JavaScript_from_a_native_finalizer
      - passing_a_JavaScript_closure_to_the_Cpp_scheduler
  pre_dispatch_checks:
    - protocol_and_kind
    - import_slot
    - input_schema
    - executable_identity
    - capability_and_effect_closure
    - owner_and_tenant
    - budget_reservation
    - replay_coordinate
  result_contract:
    success: canonical_value
    failure: stable_typed_failure
    pending: durable_journal_head

