acceptance:
  - QuickJS is the sole selected JavaScript runtime.
  - Standard JavaScript owns source composition and general computation; NeoGraph owns only its domain API and execution invariants.
  - JavaScript define evaluation lowers to validated canonical Core IR without dispatch.
  - Core-only C++ consumers remain independent of QuickJS.
  - Adversarial source cannot reach ungranted host authority.
  - Replay after process death reaches the exact pending command without repeating completed effects.
  - Parallel, race, quorum, and bounded fan-out execute in C++ ProgramRuntime and never inside a blocking QuickJS callback.
  - Sealed ng structured-concurrency constructors perform zero dispatch until their typed join command is yielded and durably admitted.
  - Structured joins preserve admitted bounds, deterministic selection, cancellation drain, child lineage, and exact replay across process death.
  - Native extension behavior is exact-bound, cancellable, durable, and ABI-versioned.
  - Stored legacy Core definitions and Programs have an explicit terminal migration classification.
  - Legacy DSL direction documents and open issues are superseded by the QuickJS issue tree.
  - No permanent Core DSL or Program DSL implementation remains after cutover.

documentation:
  update_rule: >-
    Architecture and migration contracts may precede implementation. Public API,
    reference, example, and changelog claims update only after the corresponding
    behavior is smoke-tested.
