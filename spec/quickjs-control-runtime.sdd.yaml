    isolate:
      - JavaScript_and_bridge
      - Program_scheduling
      - GraphEngine
      - provider_and_tool
      - journal_and_persistence
  gate:
    threshold_source: accepted_version_controlled_preregistration
    missing_threshold: fail
    one_off_result: never_sufficient
    noisy_or_inconclusive_result: rerun_and_record_without_relaxing_threshold_silently
    required_outcome: every_blocking_cold_warm_memory_and_overhead_threshold_passes

