  method:
    cold_case: fresh_process_and_empty_QuickJS_cache
    warm_case: fixed_documented_preparation_without_measured_warmup_samples
    minimum_valid_samples_per_case: 30
    report:
      - median
      - p95
      - median_absolute_deviation
