      role: canonical_serialization_and_low_level_interchange
      programming_language: false
    direct_Core_Cpp:
      role: embeddable_host_API
      requires_QuickJS: false
  frozen:
    - bounded_Core_DSL
    - graph_Elaborator_authoring
    - Harness_mode_dsl
    - Program_v2_v3_v4_operation_tree_authoring
    - Harness_mode_program
  stored_source_classification:
    translated:
      rule: deterministic_translation_and_equivalence_evidence_accepted
      new_runs: JavaScript_only
    drain_only:
      rule: exact_legacy_runtime_remains_available_for_already_pinned_runs
