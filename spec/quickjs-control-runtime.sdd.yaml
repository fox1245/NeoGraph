# Executable migration contract for docs/QUICKJS_CONTROL_ARCHITECTURE.md.

spec:
  id: quickjs-control-runtime
  revision: 3
  created: "2026-08-08"
  owner: fox1245
  status: accepted
  priority: P0
  kind: architecture-migration
  visibility: repository
  methodology: [SDD, TDD, EDD]
  source_baseline: 61661e9ad1fc386b5142139c48c327ede7464633
  canonical_design: docs/QUICKJS_CONTROL_ARCHITECTURE.md
  migration_plan: docs/QUICKJS_CONTROL_MIGRATION.md
  runtime_selection:
    language: javascript
    engine: quickjs
    selection: final
    alternatives_are_product_modes: false
  supersedes_direction:
    - user-authored bounded Core DSL and Core elaborator growth
    - general Program authoring through NeoGraph Program JSON operation trees
    - extending ProgramOperationKind as a general-purpose language
    - VM-free direct dispatch as the permanent general Program execution model
    - permanent parallel Core DSL and Program DSL product evolution
  product_objectives:
    easy_adoption: >-
      Standard JavaScript and its established tooling replace two
      NeoGraph-specific authoring languages; users learn only the ng domain API
      and NeoGraph authority and durability rules.
    stable_program_performance: >-
      One measured QuickJS-to-command-to-ProgramRuntime execution path has
      explicit cold and warm regression thresholds. This is a stability
      requirement, not an assumption that QuickJS is inherently faster.
    maintainability: >-
      ECMAScript owns general computation and composition while NeoGraph owns
      typed Core IR, admission, effects, durability, and GraphEngine dispatch;
      duplicate grammar, schema, lowering, and dispatcher paths are removed.

