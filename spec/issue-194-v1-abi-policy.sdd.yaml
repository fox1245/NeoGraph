spec:
  id: issue-194-v1-abi-policy
  issue: 194
  parent: 187
  status: accepted-local
  priority: P0
  kind: release-contract
  depends_on: []

problem:
  statement: >-
    GraphNode, Provider, and CheckpointStore are exported polymorphic classes.
    Virtual removal or reordering breaks existing shared-library binaries.
  evidence:
    - "include/neograph/graph/node.h:132"
    - "include/neograph/provider.h:127"
    - "include/neograph/graph/checkpoint.h:211"
    - "CMakeLists.txt:143-203"

decisions_required:
  - Pre-v1 releases may require a downstream rebuild and use SOVERSION 0.
  - SOVERSION 0 cannot make the loader reject an incompatible 0.x hot-swap;
    atomic package upgrades plus announced rebuild boundaries are the explicit
    pre-v1 risk acceptance.
  - Version 1.0 freezes the supported v1 layouts and changes SOVERSION to 1.
  - Patch and minor releases within one stable major preserve ABI unless a security fix requires an announced exception.
  - Every public library uses PROJECT_VERSION for VERSION and PROJECT_VERSION_MAJOR for SOVERSION.
  - Windows keeps unsuffixed DLL naming while package version metadata records the same policy.

red_tests:
  - id: installed-shared-consumer
    assertion: "A separately built consumer loads and executes installed libraries."
  - id: soname-inspection
    assertion: "ELF and Mach-O metadata match the declared policy."

implementation:
  - Record the policy before shipping any public layout or virtual change in this batch.
  - Add CMake version properties and package metadata.
  - Extend the installed shared-consumer check and inspect platform library metadata.
  - Publish mandatory rebuild and migration notes.

acceptance:
  - VERSION and SOVERSION are deliberate and test-covered.
  - Release notes identify every binary-incompatible boundary.
  - Shared and static installed-consumer smoke tests pass.
