# Superseded Control VM integration study.
#
# Retained as historical evidence only. The current architecture and executable
# migration contract are docs/V1_ARCHITECTURE.md and
# spec/v1-core-program-redesign.sdd.yaml.

spec:
  id: programmable-harness-vm-integration
  revision: 1
  created: "2026-07-29"
  owner: fox1245
  status: superseded
  priority: P0
  kind: architecture-execution-plan
  visibility: repository
  methodology: [SDD, TDD, EDD]
  related_issues: [245, 250, 251, 252]
  related_specs: [216, 218, 220]
  canonical_design: docs/PROGRAMMABLE_HARNESS_DSL_DESIGN.md
  superseded_at: "2026-07-31"
