  update_rule: >-
    Every implementation commit that closes or partially closes a phase item
    updates this progress block and records file/test evidence in the same
    commit series. Future planning must audit these statuses against source
    before citing them.

change_control:
  - Do not begin a large-scale refactor without explicit owner approval.
  - Prefer the smallest vertical slice that exercises frontend, lowering, verifier, VM, Kernel, and evidence.
  - New unknowns are added under semantic_decisions_required_before_vm_code or failure_modes; they are not kept only in chat.
  - Unsupported acceptance criteria remain open and block phase completion.
  - Before reporting completion, reread #245/#252 and every associated issue checklist.
