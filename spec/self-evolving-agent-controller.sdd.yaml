    - endpoint_and_transport_identity
    - probe_suite_identity
    - capability_and_credential_binding_receipts
    - provider_or_agent_identity_when_observable
    - authority_profile
    - execution_guarantee_floor
    - budget
    - timestamp
  measurements:
    - conformance
    - quality
    - reliability
    - latency_distribution
    - cost
    - determinism
    - streaming_behavior
    - cancellation_behavior
    - error_behavior
  prohibited_claims:
