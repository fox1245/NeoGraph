    - docs/QUICKJS_CONTROL_MIGRATION.md
    - docs/V1_ARCHITECTURE.md
    - spec/quickjs-control-runtime.sdd.yaml
  issue_links_required: [29, 30, 31, 32, 33, 34]
  update_rule: >-
    Public API, examples, claims, and changelog update only after the
    corresponding behavior is implemented and smoke-tested. Architecture and
    evaluation contracts may precede implementation.
