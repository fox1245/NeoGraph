    - identical_agent_from_AgentCard_alone
    - descriptor_claim_is_observed_fact

reusable_harness_memory_contract:
  artifacts:
    - HarnessDefinition
    - ProgramVersion
    - BehavioralFingerprint
    - EvaluationRecord
    - PromotionRecord
    - NegativeResult
  required_lineage:
    - source
    - runtime
    - module
    - Core_generation
    - executable_binding
    - authority_profile
    - execution_guarantee
    - budget
    - descriptor
    - parent_candidate_successor
    - run_child_fork_replacement
    - evaluation
    - activation
  retrieval:
    methods:
      - structured_filter
      - semantic_similarity
      - outcome_and_cost_filter
      - lineage_filter
    result_role: candidate_or_reference
    direct_execution: forbidden
    current_recompile_rebind_readmit: required
    negative_results_retained: true
    authority_transfer: forbidden

self_evolution_contract:
  artifact: EvolutionProposal
  required_fields:
    - proposal_identity
    - parent_program_version_identity
    - parent_activation_identity
    - evidence_identity_set
    - hypothesis
    - allowed_mutation_envelope
    - requested_authority_delta
    - candidate_ceiling
    - generation_ceiling
    - compile_and_probe_ceilings
    - evaluation_protocol_identity
    - development_set_identity
    - selection_set_identity
    - held_out_set_identity
    - metrics
    - stopping_rule
    - promotion_rule
    - minimum_execution_guarantee
    - rollback_rule
  mutation_surfaces:
    - task_decomposition
    - graph_topology
    - worker_reviewer_verifier_roles
    - model_or_provider_binding
    - concurrency_quorum_retry_timeout
    - budget_allocation
    - evidence_gates
    - capability_adapters
    - retrieval_strategy
    - reusable_harness_seed
    - requested_capabilities
  mutation_algorithms_owned_by_javascript:
    - genetic_search
    - tree_search
    - Bayesian_optimization
    - rule_based_mutation
    - model_proposed_edits
    - library_composition
  phases:
    - observe
    - propose
    - synthesize_bounded_candidates
    - compile_and_admit
    - simulate
    - shadow
    - authorized_canary
    - evaluate
    - publish
    - compare_and_swap_activate
    - monitor
    - retain_or_rollback
  evaluation_modes:
    deterministic_simulation:
      production_effects: forbidden
      bindings: recorded_or_synthetic
    shadow:
      production_commits: forbidden
      input: read_or_authorized_duplicate
    canary:
      production_effects: separately_authorized_bounded_slice
    production:
      production_effects: normal_admitted_effects
  activation:
    mechanism: existing_generation_checked_compare_and_swap
    stale_candidate: deterministic_CAS_loss_and_re_evaluation
    in_flight_run_migration: forbidden
    history_rewrite: forbidden

claim_evaluation_contract:
  status: blocking_preregistration_before_general_agent_claim
  claim_ladder:
    L0: durable_orchestrator
    L1: adaptive_controller
    L2: self_improving_controller
    L3: general_agent_controller
    AGI: outside_current_architecture_claim
  primary_hypothesis: >-
    Under a fixed resource and authority envelope, NeoGraph-generated admitted
    Harnesses improve held-out total utility for previously unseen
    machine-readable capabilities over preregistered fixed, handwritten, and
    no-evolution controls while preserving the declared guarantee floor.
  null_hypothesis: >-
    Apparent gains result from seen templates, stronger models/providers,
    uncontrolled search cost, leakage, evaluator bias, or weakened authority
    and durability semantics rather than controller adaptation.
  experiment_families:
    - unseen_OpenAPI_adaptation
    - unseen_A2A_adaptation
    - long_horizon_crash_recovery
    - cross_domain_transfer
    - held_out_self_improvement
    - evaluator_integrity_and_reward_hacking
    - bounded_autonomy_and_authority_escalation
  required_controls:
    - fixed_handwritten_harness
    - fixed_generated_template_without_probing
    - no_memory
    - no_evolution
    - random_mutation_same_budget
    - identical_model_provider_controller_only_change
    - stronger_model_fixed_controller
    - oracle_upper_bound_when_available
    - misleading_descriptor_and_evaluator_inputs
  required_measurements:
    - task_success
    - protocol_and_schema_conformance
    - total_quality
    - latency_distributions
    - recovery_time
    - model_tokens
    - tool_calls
    - external_effects
    - money
    - total_candidate_search_cost
    - human_interventions
    - candidate_and_failure_counts
    - authority_violations
    - effective_guarantee_floor
    - effect_loss_duplication_and_ambiguity
    - evaluator_independence_and_faithfulness
    - repeated_run_uncertainty
  split_rules:
    development_selection_held_out_disjoint: true
    held_out_identity_sealed_before_final_run: true
    changed_after_reveal_invalidates_result: true
  evidence_rules:
    thresholds_preregistered: true
    stopping_rule_preregistered: true
    raw_evidence_retained: true
    negative_results_retained: true
    exclusions_reported: true
    one_off_demonstration_sufficient: false
  falsification_conditions:
    - adaptation_requires_seen_descriptor_shapes
    - no_held_out_gain_over_controls_after_total_cost
    - gain_disappears_after_model_and_provider_control
    - reward_hacking_or_correlated_review_drives_promotion
    - strict_recovery_loses_or_duplicates_an_effect
    - ungranted_authority_crossed_or_weak_guarantee_hidden
    - memory_transfers_tenant_authority_or_systematically_regresses
    - search_exceeds_declared_ceiling
    - no_transfer_across_unrelated_domains_and_protocols

phases:
  C0_base_contract_gate:
    issues: [24, 25, 26, 28]
    deliver:
      - pinned QuickJS runtime and sealed JavaScript source
      - generator command protocol and deterministic replay
      - sealed define graph construction
      - versioned native control ABI
    gate: >-
      Extension implementation uses delivered base interfaces and no duplicate
      language, runtime, scheduler, journal, registry, or activation path exists.
  C1_authority_and_guarantee_profiles:
    issue: 30
    depends_on: [C0_base_contract_gate]
    deliver:
      - versioned authority profile contract
      - developer grant and effective-closure admission
      - credential use versus export separation
      - provider selection and dynamic child authority
      - authorized durable budget grants
      - strict recorded unmanaged guarantee propagation
    gate: >-
      Default source has zero ambient authority, every privileged fixture is
      available only with an explicit grant, and every composed Program reports
      the weakest reachable execution guarantee.
  C2_capability_compiler:
    issue: 31
    depends_on: [C1_authority_and_guarantee_profiles]
    deliver:
      - CapabilityDescriptor contract
      - OpenAPI frontend
      - A2A Agent Card frontend
      - MCP frontend
      - JSON Schema frontend
      - generated adapter and Harness source
      - behavioral probe and fingerprint
    gate: >-
      Unseen bounded descriptor fixtures generate admitted candidates or stable
      zero-dispatch diagnostics; descriptors never create authority.
  C3_reusable_memory:
    issue: 32
    depends_on: [C1_authority_and_guarantee_profiles]
    deliver:
      - first-class Harness and fingerprint storage
      - success failure cost feedback and evaluation retention
      - structured plus semantic retrieval
      - exact parent candidate successor lineage
    gate: >-
      Retrieved Harnesses recompile and readmit under current policy, negative
      results remain queryable, and no authority crosses a retrieval boundary.
  C4_immutable_evolution_loop:
    issue: 33
    depends_on:
      - C1_authority_and_guarantee_profiles
      - C2_capability_compiler
      - C3_reusable_memory
    deliver:
      - EvolutionProposal contract
      - bounded candidate synthesis
      - simulation and shadow evaluation
      - separately authorized canary
      - publication promotion and activation receipts
      - rollback without history mutation
    gate: >-
      Active and in-flight versions remain immutable, candidate search stops at
      every ceiling, shadow effects remain zero, and promotion follows the
      preregistered rule and activation CAS.
  C5_controller_hypothesis_evaluation:
    issue: 34
    depends_on: [C4_immutable_evolution_loop]
    deliver:
      - immutable preregistration artifacts
      - seven experiment-family fixture suites
      - fixed handwritten no-memory no-evolution random and model controls
      - repeated held-out evaluations with total-cost accounting
      - adversarial authority and evaluator tests
      - public positive and negative evidence packet
    gate: >-
      Publish only the highest claim-ladder level whose complete gates pass;
      retain the null or narrow the claim when falsification conditions hold.

documentation:
  authority: docs/SELF_EVOLVING_AGENT_CONTROLLER.md
  base_links_required:
