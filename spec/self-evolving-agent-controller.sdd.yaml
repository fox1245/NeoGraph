claim_boundary:
  accepted_now: >-
    NeoGraph is designed as a candidate model-independent controller that can
    adapt to machine-readable capabilities, synthesize and evaluate immutable
    Harness versions, preserve explicit authority, and improve future runs.
  not_accepted_now:
    - NeoGraph is AGI
    - QuickJS creates intelligence
    - one successful self-rewrite proves self-improvement
    - one domain or descriptor family proves generality
    - architecture alone proves adaptation, transfer, or agency
  promotion_rule: >-
    Public claims may name only the highest claim-ladder level whose complete
    preregistered acceptance gates pass. Negative evidence must remain
    published and narrow the claim when required.

blocking_invariants:
  one_language_one_runtime:
    statement: >-
      All handwritten and generated general Program source is standard
      JavaScript executed by the one admitted QuickJS runtime.
    proof:
      - generated and handwritten fixtures enter the same source kind and entry contracts
      - no descriptor frontend owns a source compiler or executable runtime
      - no new NeoGraph expression, loop, function, class, module, or macro language
  base_execution_ownership:
    statement: >-
      ProgramRuntime owns Program scheduling and durable child/effect lifecycle;
      GraphEngine remains the only Core/application-node executor.
    proof:
      - synthesis and descriptor adapters yield the existing typed command protocol
      - QuickJS callbacks perform zero worker, provider, tool, child, or Core dispatch
      - extension concurrency lowers to existing admitted host-owned joins and children
  default_deny_not_feature_deny:
    statement: >-
      Default JavaScript has no ambient host authority, while a developer can
      deliberately grant scoped or broad authority through admission.
    proof:
      - default profile rejects file, network, process, environment, credential export, provider selection, dynamic child compilation, native loading, and unmanaged effects
      - explicit-grant fixtures exercise every privileged authority family
      - source and descriptors can request but never create grants
      - effective grants enter immutable bundle and run identity
  descriptor_has_no_authority:
    statement: >-
      OpenAPI, A2A, MCP, JSON Schema, generated source, remote descriptions, and
      BehavioralFingerprint artifacts are untrusted declarations or evidence,
      never authorization.
    proof:
      - descriptor URL, auth scheme, endpoint, and skill claims cannot dispatch during parse or generation
      - endpoint, credential, provider, tenant, and capability grants come only from host admission
      - malformed, recursive, oversized, unsupported, and unresolved documents fail with zero dispatch
  one_admission_path:
    statement: >-
      Generated adapters, synthesized Harnesses, retrieved Harnesses, and
      handwritten Programs compile, bind, budget, and admit through one sealed
      Program path.
    proof:
      - no trusted code-generation bypass
      - identical schema, capability, effect, source, module, executable, and budget checks
      - rejection dispatch counters remain zero
  explicit_guarantee_floor:
    statement: >-
      Each Program and invocation reports the weakest execution-integrity class
      reachable through its executable, effect, and child closure.
    proof:
      - strict, recorded, and unmanaged identities are distinct
      - composition cannot silently strengthen a descendant guarantee
      - catalog, activation, invocation, replay, telemetry, and diagnostics expose the same effective floor
      - strict fixtures preserve existing exact recovery and duplicate-prevention behavior
  immutable_self_evolution:
    statement: >-
      Self-evolution creates candidate versions and changes future activation;
      it never edits active source, in-flight runs, Core generations, journal
      history, effect records, or budget ledgers in place.
    proof:
      - every candidate has a new immutable version and parent lineage
      - running Vn remains pinned after Vn+1 activation
      - stale activation compare-and-swap loses deterministically
      - rollback changes future resolution and preserves completed history
  authorized_budget_growth:
    statement: >-
      Retry, replay, resume, fork, child, replacement, and evolution do not
      replenish budget; growth requires a separate authorized journal grant.
    proof:
      - denied budget requests leave remaining balance unchanged
      - approved requests append approver, reason, amount, and decision identity
      - every child and candidate consumes explicit parent or evaluation ceilings
      - total self-improvement cost includes rejected and failed candidates
  bounded_search:
    statement: >-
      Candidate generation, compilation, probing, evaluation, and activation
      terminate at admitted ceilings.
    proof:
      - independent candidate, generation, child-depth, compile, instruction, heap, stack, wall-time, token, money, concurrency, descriptor-depth, reference, and byte limits
      - malformed or adversarial search cannot enlarge its own limits
      - exhaustion has stable terminal diagnostics and no post-terminal dispatch
  independent_promotion:
    statement: >-
      Candidate generation, evaluation, publication, and activation are
      separately attributable and require the admitted authorities declared by
      the promotion policy.
    proof:
      - synthesizer cannot self-activate by default
      - evaluator identity and evidence are bound to the decision
      - simulation and shadow profiles cannot commit production effects
      - canary and production dispatch require distinct explicit grants
  reusable_memory_is_not_authority:
    statement: >-
      Retrieved Harnesses and fingerprints are candidates or evidence; current
      admission is always authoritative.
    proof:
      - retrieval never transfers credential, tenant, endpoint, provider, activation, or budget grants
      - source and dependencies recompile and rebind under current policy
      - negative results and retirement state participate in retrieval filters
      - cross-tenant existence and content remain isolated
  falsifiable_claims:
    statement: >-
      Controller claims depend on preregistered held-out evidence and survive
      controls for model, provider, budget, search cost, leakage, and evaluator
      bias.
    proof:
      - development, selection, and final held-out sets have immutable identities
      - thresholds and stopping rules are recorded before final evaluation
      - all candidate costs, failures, exclusions, and negative outcomes are retained
      - changed-after-reveal experiments receive a new held-out set

execution_guarantee_contract:
  classes:
    strict:
      rank: 3
      effect_boundary: typed_durable_journal_and_outbox
      claims:
        - exact_recorded_replay
        - completed_non_idempotent_duplicate_prevention
        - durable_cancellation_and_reconciliation
        - crash_resume_at_declared_boundaries
    recorded:
      rank: 2
      effect_boundary: outcome_recorded_but_completion_may_be_ambiguous
      claims:
        - replay_recorded_outcomes
        - ambiguity_requires_reconciliation
      excluded_claims:
        - universal_duplicate_prevention
        - universal_exact_crash_resume
    unmanaged:
      rank: 1
      effect_boundary: developer_authorized_direct_host_or_native_effect
      claims:
        - authority_and_invocation_are_recorded_when_observable
      excluded_claims:
        - exact_replay_across_unmanaged_effect
        - duplicate_prevention_across_unmanaged_effect
        - cancellation_completion_across_unmanaged_effect
        - crash_resume_across_unmanaged_effect
  composition:
    effective_floor: minimum_rank_of_reachable_closure
    silent_weakening: reject
    explicit_weakening: admit_and_bind_to_identity
    automatic_upgrade: forbidden
    strict_parent_weak_child: requires_declared_accepted_floor

basic_authority_contract:
  default_profile: restricted_strict
  request_is_grant: false
  effective_grant: requested_intersect_developer_intersect_tenant_intersect_runtime
  grant_families:
    - network
    - filesystem_read
    - filesystem_write
    - process_spawn
    - environment_read
    - credential_use
    - credential_export
    - provider_selection
    - dynamic_child_compile
    - native_module_load
    - unmanaged_effects
  credential_rules:
    use_without_plaintext: default_binding_shape
    plaintext_export: separately_granted_high_risk_authority
    descriptor_may_grant: false
    source_may_grant: false
  provider_rules:
    default: pinned_admitted_slot
    dynamic_selection: separately_granted_and_recorded_before_replay_authority
  child_rules:
    generated_source_is_executable: false
    transitions:
      - generate
      - compile
      - derive_requirements
      - admit_immutable_version
      - reserve_budget
      - spawn_pinned_identity
    in_flight_inheritance: no_broader_than_parent_effective_authority
    future_successor_broadening: requires_external_grant_and_new_admission
  budget_grant_record:
    required_fields:
      - request_identity
      - run_identity
      - requester
      - approver
      - reason
      - amount_by_budget_dimension
      - previous_remaining_balance
      - new_remaining_balance
      - decision
      - timestamp

javascript_package_contract:
  package_manager_execution_inside_QuickJS: forbidden
  ambient_node_modules_resolution: forbidden
  acquisition_and_lock_resolution: build_or_publication_time
  compatibility_tiers:
    pure_ES_module: sealed_direct_import
    browser_neutral_bundle: reviewed_QuickJS_bundle_with_source_map
    selected_Node_style_APIs: versioned_admitted_host_modules
    native_npm_addon: admitted_native_ABI_wrapper_or_port
    full_Node_runtime_dependency: admitted_external_process_or_reject
  required_identity:
    - package_source
    - exact_version
    - lockfile
    - transformed_bundle
    - source_map
    - license_and_provenance
    - dependency_Merkle_root
    - implementation_digests
  implicit_file_network_process_or_credential_authority: false
  mutable_global_package_lookup_during_replay: forbidden

capability_descriptor_contract:
  artifact: CapabilityDescriptor
  supported_frontends:
    - OpenAPI
    - A2A_AgentCard
    - MCP
    - JSON_Schema
  required_fields:
    source:
      - descriptor_kind
      - descriptor_version
      - content_digest
      - retrieval_provenance
      - parser_identity
      - source_coordinates
    interface:
      - capability_identity
      - declared_description
      - transport
      - endpoint_declaration
      - input_schema
      - output_schema
      - error_schema
      - artifact_schema
    protocol:
      - streaming
      - pagination
      - task_lifecycle
      - cancellation
      - callbacks
      - content_modes
    requested_authority:
      - authentication_scheme
      - endpoint_scope
      - credential_role
      - capability_scopes
      - effect_hypothesis
    generated_identity:
      - adapter_source_identity
      - module_graph_identity
      - executable_candidate_identity
    diagnostics:
      - unsupported_constructs
      - ambiguity
      - limit_failures
      - rejected_references
  declaration_observation_separation: required
  reference_resolution:
    ambient_network_retrieval: false
    required_ceilings:
      - document_count
      - reference_count
      - recursion_depth
      - total_bytes
      - per_document_bytes
      - allowed_schemes
      - allowed_hosts
      - wall_time
  stages:
    - bounded_parse
    - normalize_declaration
    - generate_adapter_and_harness
    - sealed_compile
    - derive_closure
    - independent_admission
    - bounded_behavioral_probe
    - record_fingerprint
    - publish_candidate

behavioral_fingerprint_contract:
