spec:
  id: issue-201-python-update-mode
  issue: 201
  parent: 187
  status: completed
  priority: P0
  kind: correctness-parity
  depends_on: []

problem:
  statement: >-
    Python update_state list form flattens ChannelWrite into a dictionary and
    loses its reducer-versus-overwrite mode.
  evidence:
    - "bindings/python/src/bind_graph.cpp:703-730"
    - "include/neograph/graph/types.h:85-100"

contract:
  list_form: "Preserves each ChannelWrite value and mode in order."
  dict_form: "Keeps its separately documented reducer semantics."
  invariants:
    - Administrative updates remain checkpointed and versioned.
    - Mode behavior matches C++ GraphState writes.

red_tests:
  - id: overwrite-append-channel
    assertion: "Explicit overwrite replaces accumulated messages."
  - id: reduce-append-channel
    assertion: "Default reduce still appends."
  - id: mixed-write-order
    assertion: "Reduce and overwrite writes are applied in list order."

implementation:
  - Route list form through a mode-preserving C++ update path.
  - Keep dictionary conversion only for dictionary input.
  - Update Python docs and type hints.

acceptance:
  - C++ and Python update_state mode matrices agree.
  - Checkpoint, fork, version, and resume tests remain correct.

observed:
  root_cause: >-
    The Python list and tuple binding reduced ChannelWrite objects to a JSON
    object, dropping each write mode and collapsing repeated channels before
    GraphEngine applied the reducer.
  red_evidence:
    - >-
      An OVERWRITE ChannelWrite for an append channel appended to the existing
      value instead of replacing it.
    - >-
      Mixed reduce and overwrite writes, and repeated reduce writes for one
      channel, retained only the final flattened value.

resolution:
  design: >-
    Preserve the existing JSON object API for dictionary inputs. Add ordered
    ChannelWrite overloads for GraphEngine and GraphAdmin, then pass Python
    list and tuple inputs through that path without flattening their mode or
    order.
  changed_files:
    - include/neograph/graph/engine.h
    - include/neograph/graph/admin.h
    - src/core/graph_engine.cpp
    - bindings/python/src/bind_graph.cpp
    - tests/test_admin_api_barrier_preservation.cpp
    - bindings/python/tests/test_update_state_shapes.py
    - docs/python-binding.md
    - docs/python-binding.ko.md
    - docs/python-binding.ja.md
    - docs/python-binding.zh-CN.md
    - docs/reference-en.md
    - spec/issue-201-python-update-mode.sdd.yaml
  compatibility:
    - Dictionary input keeps its existing keyed reducer semantics.
    - The new ChannelWrite overload is additive; existing C++ signatures remain.
    - Ordered writes retain checkpoint, timestamp, barrier-state, and version behavior.

verification:
  targeted_python:
    command: >-
      PYTHONPATH=build_pybind:bindings/python python3 -m pytest
      bindings/python/tests/test_update_state_shapes.py -q
    result: "13 passed, 0 failed"
  targeted_cpp:
    command: >-
      ./build/tests/neograph_tests --gtest_filter='AdminApi.*:AdminApiBarrierPreservation.*:AdminApiFacade.*'
    result: "4 passed, 0 failed"
  sanitizer:
    configuration: >-
      Debug; -fsanitize=address,undefined; focused ChannelWrite and admin
      update_state coverage.
    command: >-
      ASAN_OPTIONS=strict_string_checks=1:check_initialization_order=1
      ./build-asan/tests/neograph_tests --gtest_filter='AdminApi.*:AdminApiBarrierPreservation.*:AdminApiFacade.*:ChannelWriteMode.*:ChannelWriteModeTest.*'
    result: "8 passed, 0 failed"
  cpp_full:
    command: "ctest --test-dir build --output-on-failure -j2"
    result: "802 passed, 34 skipped, 0 failed (836 discovered)"
    skips: >-
      31 PostgreSQL tests skipped because NEOGRAPH_TEST_POSTGRES_URL was unset;
      one live cancellation test and two live WebSocket tests skipped because
      their live-service environment flags and credentials were not enabled.
  python_full:
    command: >-
      PYTHONPATH=build_pybind:bindings/python python3 -m pytest
      bindings/python/tests/ -q -rs
    result: "253 passed, 4 skipped, 0 failed"
    skips: >-
      one MCP test skipped because MCP was compiled OFF; one A2A test skipped
      because the Python a2a SDK was unavailable; two live OpenAI tests skipped
      because NEOGRAPH_LIVE_LLM and OPENAI_API_KEY were not enabled.
