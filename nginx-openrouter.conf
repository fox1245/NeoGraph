# OpenRouter boundary instrumentation proxy — log per-call upstream timing
# so residual latency can be computed as turn time minus upstream time.
#
# Fields: epoch.ms total upstream-connect upstream-header upstream-response status
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
    log_format openroutertime '$msec $request_time $upstream_connect_time '
                              '$upstream_header_time $upstream_response_time $status';

    # Upstream keepalive — reuse the OpenRouter TLS pool for both clients.
    upstream openrouter {
        server openrouter.ai:443;
        keepalive 8;
    }

    server {
        listen 8080;
        access_log /logs/openrouter.log openroutertime;

        # The clients send /openrouter/v1/*; replace that prefix with
        # OpenRouter's /api/ prefix before forwarding upstream.
        location /openrouter/ {
            proxy_pass https://openrouter/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host openrouter.ai;
            proxy_ssl_server_name on;
            proxy_ssl_name openrouter.ai;
            proxy_connect_timeout 15s;
            proxy_read_timeout 180s;
            # 스트리밍 통과 — 버퍼링을 끄면 SSE 청크가 즉시 흐르고
            # $upstream_header_time 이 진짜 첫 바이트(TTFT 근사)가 된다.
            proxy_buffering off;
        }
    }
}
