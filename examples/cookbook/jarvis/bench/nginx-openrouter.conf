# OpenRouter boundary instrumentation proxy (run_bench_proxy.sh).
#
# Terminates TLS for the benchmark clients and forwards /openrouter/... to
# https://openrouter.ai/api/..., logging one line of upstream timing per call.
# Jarvis only sends an API key over TLS, so the listener is https; the
# certificate and key are mounted at /certs by the runner (throw-away CA).
#
# Access-log fields, parsed by analyze_proxy.py / analyze_ttft.py by position:
#   $msec  $request_time  $upstream_connect_time  $upstream_header_time
#   $upstream_response_time  $status
# Keep this order and one upstream per call (no proxy retries); retry timing
# lists do not match the analyzers' positional single-upstream fields.
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    log_format upstream '$msec $request_time $upstream_connect_time '
                        '$upstream_header_time $upstream_response_time $status';

    # The runner rotates this file with `mv` + `nginx -s reopen` between rounds.
    access_log /logs/openrouter.log upstream;
    error_log  /dev/stderr warn;

    server {
        listen 8443 ssl;
        ssl_certificate     /certs/server.pem;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /openrouter/ {
            proxy_pass https://openrouter.ai/api/;
            proxy_http_version 1.1;
            proxy_set_header Host openrouter.ai;
            proxy_set_header Connection "";

            proxy_ssl_server_name on;
            proxy_ssl_name openrouter.ai;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

            # Streaming responses must pass through unbuffered so
            # $upstream_header_time is the real first byte (TTFT analysis).
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_read_timeout 120s;
        }
    }
}
