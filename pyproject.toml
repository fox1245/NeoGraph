# CMake installs the Python package and its native libraries into one directory.
[build-system]
requires = ["scikit-build-core>=1.0", "pybind11==2.13.6", "ninja>=1.10"]
build-backend = "scikit_build_core.build"

[project]
name = "neograph-engine"
version = "0.13.0"
description = "C++ graph agent engine with Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "fox1245", email = "procoinmac0@gmail.com" }]
keywords = ["agent", "graph", "langgraph", "llm", "pybind11", "cpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries",
]
# certifi supplies a relocatable TLS trust store; pydantic backs StateView.
dependencies = ["certifi", "pydantic>=2.0"]

# Official protocol SDKs require Python 3.10; the core package supports 3.9.
[project.optional-dependencies]
a2a = [
    "a2a-sdk[http-server]>=1.1,<2; python_version >= '3.10'",
    "uvicorn>=0.35; python_version >= '3.10'",
]
acp = ["agent-client-protocol==0.12.1; python_version >= '3.10'"]
protocols = [
    "a2a-sdk[http-server]>=1.1,<2; python_version >= '3.10'",
    "uvicorn>=0.35; python_version >= '3.10'",
    "agent-client-protocol==0.12.1; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/fox1245/NeoGraph"
Repository = "https://github.com/fox1245/NeoGraph"
Documentation = "https://github.com/fox1245/NeoGraph#readme"
Issues = "https://github.com/fox1245/NeoGraph/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.define = { CMAKE_INSTALL_MESSAGE = "ALWAYS" }
# Explicit Ninja keeps Windows staging on the single-config install path.
cmake.args = [
    "-G", "Ninja",
    "-DBUILD_SHARED_LIBS=ON",
    "-DNEOGRAPH_BUILD_PYBIND=ON",
    "-DNEOGRAPH_BUILD_PROGRAM=ON",
    "-DNEOGRAPH_BUILD_QUICKJS_CONTROL=ON",
    "-DNEOGRAPH_BUILD_LLM=ON",
    "-DNEOGRAPH_BUILD_MCP=ON",
    "-DNEOGRAPH_BUILD_POSTGRES=ON",
    "-DNEOGRAPH_BUILD_SQLITE=ON",
    "-DNEOGRAPH_BUILD_EXAMPLES=OFF",
    "-DNEOGRAPH_BUILD_TESTS=OFF",
    "-DNEOGRAPH_BUILD_BENCHMARKS=OFF",
    "-DNEOGRAPH_INSTALL_HEADERS=OFF",
    "-DNEOGRAPH_INSTALL_EXPORT=OFF",
]
wheel.packages = []
wheel.exclude = [
    "include/**", "share/**", "lib/**", "lib64/**", "bin/**",
    "**/__pycache__/**", "**/*.pyc", "**/*.a", "**/*.lib",
]
# A positive source manifest avoids shipping workspaces, qualification records,
# build outputs, private configuration or raw provider traffic. The SDK source
# is resolved at the immutable revision in cmake/NeoGraphSchemaProvider.cmake.
sdist.inclusion-mode = "explicit"
sdist.include = [
    "/CMakeLists.txt", "/pyproject.toml", "/README.md", "/LICENSE",
    "/THIRD_PARTY_LICENSES", "/THIRD_PARTY_LICENSES.md",
    "cmake/**", "include/**", "src/**", "deps/**", "schemas/**", "proto/**",
    "bindings/python/CMakeLists.txt", "bindings/python/src/**",
    "bindings/python/neograph_engine/*.py", "bindings/python/tests/*.py",
    "bindings/python/examples/*.py", "bindings/python/examples/README.md",
]
sdist.exclude = [
    "**/.git/**", "**/.env*", "**/__pycache__/**", "**/*.pyc",
    "**/node_modules/**", "**/CMakeFiles/**", "**/CMakeCache.txt",
]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 pp*"
# Run against the repaired, installed wheel, never the build-tree extension.
# This suite covers graph execution, typed provider contracts and Program.
test-requires = ["pytest", "tomli"]
# Remove the build dependency search path before starting the test interpreter,
# so a missing repaired library cannot be supplied by the build host.
test-command = """\
python -c "import os, subprocess, sys; env = os.environ.copy(); env.pop('LD_LIBRARY_PATH', None); env.pop('DYLD_LIBRARY_PATH', None); env.pop('PYTHONPATH', None); subprocess.run([sys.executable, '-m', 'pytest', '-q', sys.argv[1]], env=env, check=True)" "{package}/bindings/python/tests/"\
"""
test-skip = ""

[tool.cibuildwheel.linux]
# OpenSSL 3 requires the AlmaLinux 9 image (glibc >=2.34). Its system curl
# predates the SDK's minimum version, so before-all builds a pinned HTTP/2 curl.
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_34_x86_64"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_34_aarch64"
before-all = 'bash "{package}/cmake/build-wheel-curl.sh"'
environment = { CMAKE_PREFIX_PATH = "/opt/neograph-wheel-deps", LD_LIBRARY_PATH = "/opt/neograph-wheel-deps/lib:$LD_LIBRARY_PATH" }
# Preserve the full installed-wheel suite before the native cold-loader gate.
test-command = """\
python -c "import os, subprocess, sys; env = os.environ.copy(); env.pop('LD_LIBRARY_PATH', None); env.pop('DYLD_LIBRARY_PATH', None); env.pop('PYTHONPATH', None); subprocess.run([sys.executable, '-m', 'pytest', '-q', sys.argv[1]], env=env, check=True); subprocess.run([sys.executable, '-I', sys.argv[2], '--package', sys.argv[3]], env=env, check=True)" "{package}/bindings/python/tests/" "{package}/cmake/test-wheel-lgpl-replacement.py" "{package}"\
"""

[tool.cibuildwheel.windows]
# SchemaProvider requires curl even if NeoGraph's separate curl pool is disabled.
before-all = "vcpkg install openssl[tools]:x64-windows libpq:x64-windows sqlite3:x64-windows curl[http2,openssl]:x64-windows"
environment = { CMAKE_TOOLCHAIN_FILE = "C:\\\\vcpkg\\\\scripts\\\\buildsystems\\\\vcpkg.cmake" }
# Search bundled engine/SDK DLLs and mangle external dependency names; otherwise
# a preloaded system sqlite3.dll can shadow the wheel's SQLite build.
repair-wheel-command = """\
pip install delvewheel && \
python -m delvewheel repair --ignore-existing -w {dest_dir} {wheel} \
  --with-mangle \
  --add-path C:\\\\vcpkg\\\\installed\\\\x64-windows\\\\bin\
"""

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = 'bash "{package}/cmake/build-wheel-macos.sh"'
# LLVM 20 ships stable stop_token support; AppleClang 15's libc++ does not.
# Use the matching Homebrew runtime, not new headers with the old system dylib.
# llvm@20 has an arm64 Sonoma bottle; delocate must retain the macOS 14 floor
# when bundling libc++, libc++abi, libunwind and the other dependency dylibs.
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0", CC = "/opt/homebrew/opt/llvm@20/bin/clang", CXX = "/opt/homebrew/opt/llvm@20/bin/clang++", CXXFLAGS = "-stdlib=libc++ -nostdinc++ -isystem /opt/homebrew/opt/llvm@20/include/c++/v1", LDFLAGS = "-L/opt/homebrew/opt/llvm@20/lib/c++ -L/opt/homebrew/opt/llvm@20/lib/unwind -Wl,-rpath,/opt/homebrew/opt/llvm@20/lib/c++ -Wl,-rpath,/opt/homebrew/opt/llvm@20/lib/unwind -lunwind", CMAKE_PREFIX_PATH = "/opt/homebrew/opt/libpq:/opt/homebrew/opt/sqlite:/opt/homebrew/opt/openssl@3:/opt/homebrew/opt/curl", PATH = "/opt/homebrew/opt/openssl@3/bin:$PATH" }
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} --require-target-macos-version 14.0 --sanitize-rpaths -w {dest_dir} -v {wheel}"
# Every actual macOS 14 arm64 wheel must pass the full suite, then relocation.
test-command = """\
python -c "import os, subprocess, sys; env = os.environ.copy(); env.pop('LD_LIBRARY_PATH', None); env.pop('DYLD_LIBRARY_PATH', None); env.pop('PYTHONPATH', None); subprocess.run([sys.executable, '-m', 'pytest', '-q', sys.argv[1]], env=env, check=True); subprocess.run([sys.executable, '-I', sys.argv[2]], env=env, check=True)" "{package}/bindings/python/tests/" "{package}/cmake/test-macos-wheel-relocation.py"\
"""
