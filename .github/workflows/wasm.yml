name: WebAssembly
# The graph engine for a WebAssembly host (#535): the single-thread Emscripten build of the graph smoke and of the
# JavaScript module (model calls through the host's fetch), with a curl-free SchemaProvider and no OpenSSL, run under
# Node 22 and 24: the smoke program, the wasm32 checks, the module against a local OpenAI-compatible server (no
# network, no key) for graphs and for Programs, and the Workers example's fetch handler called in Node. The Program
# stores of a JavaScript host: the store conformance suites run against the JavaScript adapters over the reference
# store, and the adapters are checked against stores whose methods return Promises. Size gates for the smoke program and the
# module. The pthread build is a second job. Both pin the Emscripten toolchain: 6.0.13, from the emsdk commit that
# is that release.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'deps/**'
      - 'wasm/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/wasm.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'deps/**'
      - 'wasm/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSCRIPTEN_VERSION: 6.0.13
  # The emsdk release commit of 6.0.13; `emsdk install` then fetches exactly that toolchain.
  EMSDK_COMMIT: 35659964bc2762fffec0d257997fb61475f765b7

jobs:
  single-thread:
    name: single-thread (Node 22 and 24)
    runs-on: ubuntu-24.04
    # The job also builds the Program component, QuickJS and the two store test modules.
    timeout-minutes: 45
    env:
      # The size gates. Budgets are the measured size (-O3 -flto, Release) plus about 9%: the graph smoke is 5.62 MB
      # and 1.64 MB gzipped. The JavaScript module adds the LLM component, the SDK's JavaScript host, the C API, the
      # Program component with the QuickJS control runtime, and the adapters for the host's stores (13.21 MB and
      # 3.93 MB gzipped; the module that runs graphs only is 6.47 MB and 1.89 MB).
      MAX_WASM_BYTES: 6000000
      MAX_GZIP_BYTES: 1750000
      MAX_MODULE_WASM_BYTES: 14400000
      MAX_MODULE_GZIP_BYTES: 4300000
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned emsdk
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: ${{ env.EMSDK_COMMIT }}
          path: emsdk
      - name: Install Emscripten
        run: |
          ./emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
      - name: Record the toolchain
        run: |
          source emsdk/emsdk_env.sh
          emcc --version | head -n 1
          cmake --version | head -n 1
      - name: Configure the single-thread build
        run: |
          source emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNEOGRAPH_BUILD_WASM=ON -DNEOGRAPH_BUILD_WASM_JS=ON -DNEOGRAPH_BUILD_PROGRAM=ON \
            -DNEOGRAPH_BUILD_QUICKJS_CONTROL=ON \
            -DNEOGRAPH_BUILD_ASYNC=OFF -DNEOGRAPH_BUILD_LLM=ON -DNEOGRAPH_BUILD_MCP=OFF \
            -DNEOGRAPH_BUILD_MCP_CLIENT=OFF -DNEOGRAPH_BUILD_MCP_SERVER=OFF -DNEOGRAPH_BUILD_MCP_HTTP_SERVER=OFF \
            -DNEOGRAPH_BUILD_A2A=OFF -DNEOGRAPH_BUILD_ACP=OFF -DNEOGRAPH_BUILD_GRPC=OFF \
            -DNEOGRAPH_BUILD_POSTGRES=OFF -DNEOGRAPH_BUILD_SQLITE=OFF -DNEOGRAPH_BUILD_UTIL=OFF \
            -DNEOGRAPH_BUILD_EXAMPLES=OFF -DNEOGRAPH_BUILD_TESTS=OFF -DNEOGRAPH_BUILD_BENCHMARKS=OFF \
            -DNEOGRAPH_USE_LIBCURL=OFF -DNEOGRAPH_BUILD_WASM_STORE_TESTS=ON
      - name: Check that the configuration is single-thread, curl-free, OpenSSL-free and uses exceptions
        run: |
          fail() { echo "configuration check failed: $1"; exit 1; }
          if grep -q -e '-pthread' build-wasm/build.ninja; then fail "-pthread is on a command line"; fi
          grep -q 'ASIO_DISABLE_THREADS' build-wasm/build.ninja || fail "ASIO_DISABLE_THREADS is not defined"
          grep -q -e '-fexceptions' build-wasm/build.ninja || fail "-fexceptions is not set"
          grep -Eq '^#define NEOGRAPH_BUILD_THREADS 0$' build-wasm/generated/neograph/build_config.h \
            || fail "neograph/build_config.h does not record a single-thread build"
          grep -Eq '^#define SP_BUILD_THREADS 0$' build-wasm/_deps/neograph_schemaprovider-build/generated/sp/build_config.h \
            || fail "sp/build_config.h does not record a single-thread build"
          if ninja -C build-wasm -t targets all | grep -q 'sp_transport'; then fail "sp_transport is configured"; fi
          if grep -q -i -E 'openssl|libssl|libcrypto' build-wasm/build.ninja; then fail "OpenSSL is on a command line"; fi
          ninja -C build-wasm -t targets all | grep -q 'neograph_llm' || fail "neograph_llm is not configured"
          ninja -C build-wasm -t targets all | grep -q 'sp_js_host' || fail "sp_js_host is not configured"
      - name: Build the smoke program, the wasm32 checks, the JavaScript module and the Program store tests
        run: |
          source emsdk/emsdk_env.sh
          time cmake --build build-wasm --target neograph_wasm_smoke neograph_wasm_checks neograph_js \
            neograph_wasm_store_conformance neograph_wasm_store_checks --parallel
          ls -l build-wasm/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # The newest patch release, not the one cached on the runner image.
          check-latest: true
      - name: Run the smoke program, the checks, the module tests and the Program store tests on Node 22
        run: |
          node --version
          node build-wasm/wasm/smoke.js > smoke.out && cat smoke.out
          grep -q '^doubled = 42$' smoke.out
          grep -q '^trace = d' smoke.out
          node build-wasm/wasm/checks.js > checks.out && cat checks.out
          grep -q '^all checks passed$' checks.out
          node wasm/test/llm_host_test.mjs build-wasm/wasm | tee module.out
          tail -n 1 module.out | grep -q '^all checks passed$'
          node wasm/test/workers_test.mjs build-wasm/wasm | tee workers.out
          tail -n 1 workers.out | grep -q '^all checks passed$'
          node wasm/test/program_test.mjs build-wasm/wasm | tee program.out
          tail -n 1 program.out | grep -q '^all checks passed$'
          node wasm/test/program_replacement_test.mjs build-wasm/wasm | tee program-replacement.out
          tail -n 1 program-replacement.out | grep -q '^all checks passed$'
          node wasm/test/program_stores_test.mjs build-wasm/wasm | tee program-stores.out
          tail -n 1 program-stores.out | grep -q '^all checks passed$'
          node wasm/test/store_conformance_test.mjs build-wasm/wasm | tee conformance.out
          tail -n 1 conformance.out | grep -q '^all checks passed$'
          node wasm/test/js_stores_test.mjs build-wasm/wasm | tee stores.out
          tail -n 1 stores.out | grep -q '^all checks passed$'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # The newest patch release, not the one cached on the runner image.
          check-latest: true
      - name: Run the smoke program, the checks, the module tests and the Program store tests on Node 24
        run: |
          node --version
          node build-wasm/wasm/smoke.js > smoke.out && cat smoke.out
          grep -q '^doubled = 42$' smoke.out
          grep -q '^trace = d' smoke.out
          node build-wasm/wasm/checks.js > checks.out && cat checks.out
          grep -q '^all checks passed$' checks.out
          node wasm/test/llm_host_test.mjs build-wasm/wasm | tee module.out
          tail -n 1 module.out | grep -q '^all checks passed$'
          node wasm/test/workers_test.mjs build-wasm/wasm | tee workers.out
          tail -n 1 workers.out | grep -q '^all checks passed$'
          node wasm/test/program_test.mjs build-wasm/wasm | tee program.out
          tail -n 1 program.out | grep -q '^all checks passed$'
          node wasm/test/program_replacement_test.mjs build-wasm/wasm | tee program-replacement.out
          tail -n 1 program-replacement.out | grep -q '^all checks passed$'
          node wasm/test/program_stores_test.mjs build-wasm/wasm | tee program-stores.out
          tail -n 1 program-stores.out | grep -q '^all checks passed$'
          node wasm/test/store_conformance_test.mjs build-wasm/wasm | tee conformance.out
          tail -n 1 conformance.out | grep -q '^all checks passed$'
          node wasm/test/js_stores_test.mjs build-wasm/wasm | tee stores.out
          tail -n 1 stores.out | grep -q '^all checks passed$'
      - name: Size gate
        run: |
          python3 wasm/size_gate.py --label "Graph smoke, single-thread, Emscripten $EMSCRIPTEN_VERSION" \
            --wasm build-wasm/wasm/smoke.wasm --js build-wasm/wasm/smoke.js \
            --max-wasm "$MAX_WASM_BYTES" --max-gzip "$MAX_GZIP_BYTES"
          python3 wasm/size_gate.py --label "JavaScript module, single-thread, Emscripten $EMSCRIPTEN_VERSION" \
            --wasm build-wasm/wasm/neograph_module.wasm --js build-wasm/wasm/neograph_module.mjs \
            --max-wasm "$MAX_MODULE_WASM_BYTES" --max-gzip "$MAX_MODULE_GZIP_BYTES"

  pthread:
    name: pthread (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned emsdk
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: ${{ env.EMSDK_COMMIT }}
          path: emsdk
      - name: Install Emscripten
        run: |
          ./emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
      - name: Configure the pthread build
        run: |
          source emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm-pthread -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNEOGRAPH_THREADS=ON -DNEOGRAPH_BUILD_WASM=ON \
            -DNEOGRAPH_BUILD_ASYNC=OFF -DNEOGRAPH_BUILD_LLM=OFF -DNEOGRAPH_BUILD_MCP=OFF \
            -DNEOGRAPH_BUILD_MCP_CLIENT=OFF -DNEOGRAPH_BUILD_MCP_SERVER=OFF -DNEOGRAPH_BUILD_MCP_HTTP_SERVER=OFF \
            -DNEOGRAPH_BUILD_A2A=OFF -DNEOGRAPH_BUILD_ACP=OFF -DNEOGRAPH_BUILD_GRPC=OFF \
            -DNEOGRAPH_BUILD_POSTGRES=OFF -DNEOGRAPH_BUILD_SQLITE=OFF -DNEOGRAPH_BUILD_UTIL=OFF \
            -DNEOGRAPH_BUILD_EXAMPLES=OFF -DNEOGRAPH_BUILD_TESTS=OFF -DNEOGRAPH_BUILD_BENCHMARKS=OFF \
            -DNEOGRAPH_USE_LIBCURL=OFF
      - name: Check that the configuration is threaded
        run: |
          fail() { echo "configuration check failed: $1"; exit 1; }
          grep -q -e '-pthread' build-wasm-pthread/build.ninja || fail "-pthread is not on a command line"
          if grep -q 'ASIO_DISABLE_THREADS' build-wasm-pthread/build.ninja; then fail "ASIO_DISABLE_THREADS is defined"; fi
          grep -Eq '^#define NEOGRAPH_BUILD_THREADS 1$' build-wasm-pthread/generated/neograph/build_config.h \
            || fail "neograph/build_config.h does not record a threaded build"
      - name: Build the smoke program
        run: |
          source emsdk/emsdk_env.sh
          time cmake --build build-wasm-pthread --target neograph_wasm_smoke --parallel
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # The newest patch release, not the one cached on the runner image.
          check-latest: true
      - name: Run the smoke program on Node 24
        run: |
          node --version
          node build-wasm-pthread/wasm/smoke.js > smoke.out && cat smoke.out
          grep -q '^doubled = 42$' smoke.out
          grep -q '^trace = d' smoke.out
      - name: Report the sizes
        run: |
          python3 wasm/size_gate.py --label "Graph smoke, pthread, Emscripten $EMSCRIPTEN_VERSION" \
            --wasm build-wasm-pthread/wasm/smoke.wasm --js build-wasm-pthread/wasm/smoke.js
