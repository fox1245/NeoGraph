name: CI extended
# Verification that is valuable but too heavy for every push: sanitizers (ASan/UBSan/LSan, TSan,
# MSVC ASan), the libFuzzer canary, benchmark, benchmark A/B and QuickJS performance gates, native
# ARM64, the gRPC contract, and the rest of the installed-consumer matrix.
#
# It runs every night, on demand (Actions -> CI extended -> Run workflow), and when this file, the
# reusable consumer workflow or the benchmark gate files change. Run it on the release candidate
# before tagging a release.

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      bench_ab_base:
        description: >-
          bench-ab base: empty compares with the merge base (the previous release on master);
          a commit or tag names another; head compares the build with itself, five times,
          to measure the runner's noise (A/A)
        required: false
        default: ''
  pull_request:
    paths:
      - '.github/workflows/ci-extended.yml'
      - '.github/workflows/install-consumable.yml'
      - '.github/workflows/windows-asan.yml'
      - '.github/actions/**'
      - 'benchmarks/ci_ab_gates.json'
      - 'scripts/run_ci_ab_gates.py'
      - 'scripts/check_ci_benchmarks.py'

# A newer push or dispatch cancels the run in progress for the same ref. The
# nightly schedule does not: it queues behind a dispatched run instead of
# cancelling it partway through the sanitizer job.

# Least privilege: jobs only read the repository; artifacts and caches use the
# runner's own token.
permissions:
  contents: read

concurrency:
  group: ci-extended-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  grpc-graph-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install opt-in gRPC toolchain
        run: |
          bash scripts/ci_apt_install.sh cmake build-essential pkg-config \
            libssl-dev libcurl4-openssl-dev libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
      - name: Verify gRPC shared contract
        run: python scripts/verify_ci.py grpc --work-dir build-grpc --jobs auto

  # Actual hosted ARM64, not an x86 substitute. PG remains build-only here.
  # Skipped for now: Linux ARM64 is built and tested on our own ARM server instead.
  build-and-test-arm64:
    if: ${{ false }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          bash scripts/ci_apt_install.sh cmake build-essential libpq-dev libsqlite3-dev \
            libssl-dev libcurl4-openssl-dev pkg-config
      - name: Verify native ARM64 all-backend build
        run: python scripts/verify_ci.py native-posix --work-dir build-native --jobs auto
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-arm64
          path: build-native/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # The per-push Windows lane uses Ninja; this keeps the Visual Studio generator that most MSVC
  # users configure with under test. Its build is serial per project, so it takes about 35 minutes.
  build-windows-vs:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK transport dependencies
        uses: ./.github/actions/windows-transport-deps
      - name: Verify native Visual Studio generator, C ABI and full ctest
        run: python scripts/verify_ci.py native-windows --work-dir build-native --jobs auto --generator "Visual Studio 17 2022"
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-windows-vs
          path: build-native/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # The MSVC ASan check lives in its own workflow so that it can also be dispatched alone.
  build-windows-asan:
    uses: ./.github/workflows/windows-asan.yml

  bench-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: bash scripts/ci_apt_install.sh cmake build-essential libssl-dev libcurl4-openssl-dev libsqlite3-dev pkg-config
      - name: Verify original four benchmark gates
        run: python scripts/verify_ci.py benchmark --work-dir build-bench --jobs auto

  # The benchmarks of benchmarks/ci_ab_gates.json on this commit and on a base built on the same
  # runner, interleaved, with a tolerance per case (#549). bench-regression keeps the absolute
  # limits as a last resort.
  bench-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The comparison builds an older commit as its base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: bash scripts/ci_apt_install.sh cmake build-essential libssl-dev libcurl4-openssl-dev libsqlite3-dev pkg-config
      - name: Choose the A/B comparison base
        id: base
        env:
          REQUESTED_BASE: ${{ inputs.bench_ab_base }}
        # As in quickjs-performance: a branch compares with its merge base on master; master
        # itself with the latest release before it. A dispatch can name another base, or head.
        run: |
          if [ -n "$REQUESTED_BASE" ]; then
            base="$REQUESTED_BASE"
          else
            git fetch --no-tags --quiet origin master
            base=$(git merge-base HEAD origin/master)
            if [ "$base" = "$(git rev-parse HEAD)" ]; then
              base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || git rev-parse HEAD^)
            fi
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          if [ "$base" = head ]; then echo "A/B base: head (A/A run)"
          else echo "A/B base: $base ($(git log -1 --format=%s "$base"))"; fi
      - name: Verify benchmark A/B gates
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          extra=()
          if [ "$BASE_REF" = head ]; then extra=(--calibrate 5); fi
          python scripts/verify_ci.py bench-ab --work-dir "$RUNNER_TEMP/neograph-bench-ab" --jobs auto --base "$BASE_REF" "${extra[@]}"
      - name: Upload benchmark A/B report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ab-report
          path: ${{ runner.temp }}/neograph-bench-ab/bench-ab.json
          if-no-files-found: error
          retention-days: 90

  quickjs-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The A/B comparison builds an older commit as its base (#476).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: bash scripts/ci_apt_install.sh cmake build-essential libssl-dev libcurl4-openssl-dev pkg-config
      - name: Choose the A/B comparison base
        id: base
        # A branch compares with its merge base on master; master itself with
        # the latest release before it.
        run: |
          git fetch --no-tags --quiet origin master
          base=$(git merge-base HEAD origin/master)
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || git rev-parse HEAD^)
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          echo "A/B base: $base ($(git log -1 --format=%s "$base"))"
      - name: Verify immutable QuickJS matrix
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: python scripts/verify_ci.py quickjs-performance --work-dir "$RUNNER_TEMP/neograph-quickjs-performance" --jobs auto --base "$BASE_REF"
      - name: Upload QuickJS performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-performance-report
          path: ${{ runner.temp }}/neograph-quickjs-performance/quickjs-performance.json
          if-no-files-found: error
          retention-days: 90

  # Observed 76-108 minutes on hosted runners (build and serial ctest both vary by about 40%
  # between days); the limit keeps headroom for a slow day without failing the nightly run.
  sanitizer-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: neograph_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and Python test dependencies
        run: |
          bash scripts/ci_apt_install.sh cmake build-essential libssl-dev libcurl4-openssl-dev \
            libpq-dev postgresql-client libsqlite3-dev pkg-config ccache
          python -m pip install --quiet pytest pydantic certifi
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-asan-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-asan-${{ runner.os }}-
      # The same setup as ci.yml's Linux job; each sanitizer has its own cache, since
      # its flags change every object. Saved even when a test fails: the build is valid.
      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          ccache --max-size=2G
          ccache --zero-stats
      - name: Verify full ASan UBSan LSan native, examples and Python
        env:
          NEOGRAPH_TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/neograph_test
        run: python scripts/verify_ci.py asan --work-dir build-asan --jobs auto --ccache
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-asan-${{ runner.os }}-${{ github.sha }}

  tsan-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies and process-local ASLR tool
        run: |
          bash scripts/ci_apt_install.sh cmake build-essential libssl-dev libcurl4-openssl-dev libsqlite3-dev pkg-config util-linux ccache
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-tsan-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-tsan-${{ runner.os }}-
      # The same setup as ci.yml's Linux job; each sanitizer has its own cache, since
      # its flags change every object. Saved even when a test fails: the build is valid.
      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          ccache --max-size=1500M
          ccache --zero-stats
      - name: Verify native TSan suite and real examples
        run: python scripts/verify_ci.py tsan --work-dir build-tsan --jobs auto --ccache
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-tsan-${{ runner.os }}-${{ github.sha }}

  fuzz-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Clang and build dependencies
        run: bash scripts/ci_apt_install.sh cmake build-essential clang libssl-dev libcurl4-openssl-dev libsqlite3-dev pkg-config
      - name: Verify 60-second libFuzzer canary
        run: python scripts/verify_ci.py fuzz --work-dir build-fuzz --jobs auto

  # The installed-consumer variants that ci.yml does not run per push.
  install-consumable:
    uses: ./.github/workflows/install-consumable.yml
    with:
      matrix: >-
        [{"name":"linux-static","os":"ubuntu-24.04","args":""},
         {"name":"linux-core-shared","os":"ubuntu-24.04","args":"--core-only --shared"},
         {"name":"linux-program-static","os":"ubuntu-24.04","args":"--program --quickjs"},
         {"name":"linux-program-shared","os":"ubuntu-24.04","args":"--program --quickjs --shared"},
         {"name":"macos-shared","os":"macos-26","args":"--shared"},
         {"name":"macos-program-shared","os":"macos-26","args":"--program --quickjs --shared"},
         {"name":"windows-shared","os":"windows-2022","args":"--shared"},
         {"name":"windows-program-shared","os":"windows-2022","args":"--program --shared"}]
