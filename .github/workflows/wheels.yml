name: Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'bindings/python/**'
      - 'src/**'
      - 'include/**'
      - 'deps/**'
      - '.github/workflows/wheels.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'bindings/python/**'
      - 'src/**'
      - 'include/**'
      - 'deps/**'
      - '.github/workflows/wheels.yml'

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Release tag does not match pyproject.toml project.version')
          PY
      - name: Build and check sdist
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  build_wheels:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Keep all existing release targets. SDK platform portability is a
      # release prerequisite; failures must block publication, not hide a row.
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: AMD64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: source-dist
      # Building every wheel from the sdist proves its manifest is sufficient.
      - name: Extract source distribution
        shell: bash
        run: |
          mkdir -p source-dist/source
          tar -xzf source-dist/*.tar.gz --strip-components=1 -C source-dist/source
      # Ninja does not activate the MSVC compiler environment itself.
      - name: Activate MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Expose OpenSSL tool for local TLS test peers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/openssl" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      - name: Build, repair and exercise installed wheels
        uses: pypa/cibuildwheel@v2.23
        with:
          package-dir: source-dist/source
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  runtime_portability:
    name: Native archive / ${{ matrix.os }}
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: source-dist
      - name: Extract source distribution
        shell: bash
        run: |
          mkdir -p source-dist/source
          tar -xzf source-dist/*.tar.gz --strip-components=1 -C source-dist/source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libssl-dev
      - name: Install SDK dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja
          export MACOSX_DEPLOYMENT_TARGET=14.0
          export CC=/opt/homebrew/opt/llvm@20/bin/clang
          export CXX=/opt/homebrew/opt/llvm@20/bin/clang++
          export CXXFLAGS="-stdlib=libc++ -nostdinc++ -isystem /opt/homebrew/opt/llvm@20/include/c++/v1"
          export LDFLAGS="-L/opt/homebrew/opt/llvm@20/lib/c++ -L/opt/homebrew/opt/llvm@20/lib/unwind -Wl,-rpath,/opt/homebrew/opt/llvm@20/lib/c++ -Wl,-rpath,/opt/homebrew/opt/llvm@20/lib/unwind -lunwind"
          bash source-dist/source/cmake/build-wheel-macos.sh
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3):$(brew --prefix curl)" >> $GITHUB_ENV
          printf '%s\n' "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" \
            "CC=$CC" "CXX=$CXX" "CXXFLAGS=$CXXFLAGS" "LDFLAGS=$LDFLAGS" >> $GITHUB_ENV
      - name: Activate MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install SDK dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install "curl[http2,openssl]:x64-windows" openssl:x64-windows
          $root = $env:VCPKG_INSTALLATION_ROOT
          "CMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "$root/installed/x64-windows/bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      - name: Configure public SDK archive proof
        shell: bash
        run: |
          cmake -S source-dist/source -B runtime-proof -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DNEOGRAPH_BUILD_ASYNC=OFF -DNEOGRAPH_BUILD_LLM=OFF \
            -DNEOGRAPH_BUILD_MCP=OFF -DNEOGRAPH_BUILD_A2A=OFF \
            -DNEOGRAPH_BUILD_ACP=OFF -DNEOGRAPH_BUILD_UTIL=OFF \
            -DNEOGRAPH_BUILD_POSTGRES=OFF -DNEOGRAPH_BUILD_SQLITE=OFF \
            -DNEOGRAPH_BUILD_EXAMPLES=OFF -DNEOGRAPH_BUILD_TESTS=OFF \
            -DSP_BUILD_TESTS=OFF -DSP_BUILD_CANARY=OFF \
            -DSP_BUILD_RUNTIME_TESTS=ON
      - name: Build and exercise archive custody
        shell: bash
        run: |
          cmake --build runtime-proof --target sp_native_archive_portability_tests --parallel 2
          ctest --test-dir runtime-proof/_deps/neograph_schemaprovider-build \
            -C Release -R '^native_archive_portability$' --no-tests=error --output-on-failure

  # OIDC trust is bound to fox1245/NeoGraph, wheels.yml and environment release.
  # All platform builds and installed graph/provider/Program tests must succeed.
  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist, runtime_portability]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: release
      url: https://pypi.org/p/neograph-engine
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
