name: Wheels
# Packaging gate: builds the sdist and the wheels, repairs them, and runs the Python suite against
# the installed wheel.
#   - pull requests and master pushes that touch packaging inputs: one CPython (3.12) per platform,
#     which proves the packaging path without rebuilding every interpreter;
#   - release tags, the weekly canary and manual runs: every supported CPython, then (tags only)
#     protected PyPI publication.
# Source-only changes are verified by ci.yml; the weekly canary catches a packaging regression that
# they cause.

on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Build every supported CPython (unchecked: only CPython 3.12)'
        type: boolean
        default: true
  schedule:
    - cron: '0 20 * * 0'
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'bindings/python/**'
      - 'scripts/verify_ci.py'
      - 'scripts/check_install_consumer.py'
      - '.github/workflows/wheels.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'bindings/python/**'
      - 'scripts/verify_ci.py'
      - 'scripts/check_install_consumer.py'
      - '.github/workflows/wheels.yml'

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision source packaging tools
        run: python -m pip install build twine "scikit-build-core>=1.0" pybind11==2.13.6 "ninja>=1.10"
      - name: Build, enforce release version and check sdist
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/verify_ci.py sdist --work-dir build-sdist --jobs 2 --release-tag "$RELEASE_TAG"
          else
            python scripts/verify_ci.py sdist --work-dir build-sdist --jobs 2
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: build-sdist/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # One job per platform and CPython: the jobs run in parallel instead of rebuilding the C++ five
  # times in sequence inside one job.
  build_wheels:
    name: ${{ matrix.platform.os }} / ${{ matrix.platform.arch }} / ${{ matrix.python }}
    needs: build_sdist
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {os: ubuntu-latest, arch: x86_64}
          - {os: ubuntu-24.04-arm, arch: aarch64}
          - {os: macos-14, arch: arm64}
          - {os: windows-latest, arch: AMD64}
        python: ${{ fromJSON((github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full)) && '["cp39","cp310","cp311","cp312","cp313"]' || '["cp312"]') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: source-dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Build from the actual sdist without Git or Bash, including on Windows.
      - name: Extract source distribution
        run: >-
          python -c "import pathlib,tarfile; root=pathlib.Path('source-dist'); archives=list(root.glob('*.tar.gz')); assert len(archives)==1, 'expected one sdist'; tarfile.open(archives[0]).extractall(root/'unpacked',filter='data'); sources=list((root/'unpacked').iterdir()); assert len(sources)==1 and sources[0].is_dir(), 'expected one source root'; sources[0].rename(root/'source')"
      - name: Activate MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Provision wheel build frontend
        run: python -m pip install cibuildwheel==2.23.0
      # vcpkg's binary archives are reused across runs. vcpkg names each archive by an ABI hash, so
      # it uses only a matching one and rebuilds the rest; the key is per runner image so a new image
      # saves its own archives, and restore-keys let it start from the previous image's.
      - name: Prepare the vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        shell: pwsh
        run: |
          $archives = Join-Path $env:RUNNER_TEMP 'vcpkg-archives'
          New-Item -ItemType Directory -Force -Path $archives | Out-Null
          "archives=$archives" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "VCPKG_DEFAULT_BINARY_CACHE=$archives" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - name: Restore vcpkg binary archives (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.archives }}
          key: vcpkg-wheel-${{ runner.os }}-${{ steps.vcpkg-cache.outputs.image }}-${{ hashFiles('source-dist/source/cmake/windows-wheel/vcpkg.json') }}
          restore-keys: |
            vcpkg-wheel-${{ runner.os }}-
      # The runner image's vcpkg checkout is shallow and can predate the baseline pinned by
      # the wheel manifest: it lacks the baseline commit and its version database, so
      # `vcpkg install` fails before any wheel is built. Use a dedicated checkout of exactly
      # that baseline instead of the image's.
      - name: Provision vcpkg at the baseline pinned by the wheel manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baseline = (Get-Content source-dist/source/cmake/windows-wheel/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if (-not $baseline) { throw 'windows-wheel/vcpkg.json has no builtin-baseline' }
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg-baseline'
          git init --quiet $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch --quiet --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "could not fetch vcpkg baseline $baseline" }
          git -C $root checkout --quiet FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'could not check out the vcpkg baseline' }
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          "VCPKG_INSTALLATION_ROOT=$root" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          $root | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      # Platform dependency bootstrap, repair and installed-wheel gates remain authoritative in
      # pyproject.toml (including cold-load/LGPL checks).
      - name: Build, repair and exercise the installed wheel
        run: python source-dist/source/scripts/verify_ci.py wheel --work-dir build-wheels --jobs auto --arch ${{ matrix.platform.arch }} --python ${{ matrix.python }}
      - name: Save vcpkg binary archives (Windows)
        if: always() && runner.os == 'Windows' && steps.vcpkg-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.archives }}
          key: vcpkg-wheel-${{ runner.os }}-${{ steps.vcpkg-cache.outputs.image }}-${{ hashFiles('source-dist/source/cmake/windows-wheel/vcpkg.json') }}
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.python }}
          path: build-wheels/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  runtime_portability:
    name: Native archive / ${{ matrix.os }}
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: source-dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract source distribution
        run: >-
          python -c "import pathlib,tarfile; root=pathlib.Path('source-dist'); archives=list(root.glob('*.tar.gz')); assert len(archives)==1, 'expected one sdist'; tarfile.open(archives[0]).extractall(root/'unpacked',filter='data'); sources=list((root/'unpacked').iterdir()); assert len(sources)==1 and sources[0].is_dir(), 'expected one source root'; sources[0].rename(root/'source')"
      - name: Install SDK dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libssl-dev
      - name: Install SDK dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja
          export MACOSX_DEPLOYMENT_TARGET=14.0
          export CC=/opt/homebrew/opt/llvm@20/bin/clang
          export CXX=/opt/homebrew/opt/llvm@20/bin/clang++
          export CXXFLAGS="-stdlib=libc++ -nostdinc++ -isystem /opt/homebrew/opt/llvm@20/include/c++/v1"
          export LDFLAGS="-L/opt/homebrew/opt/llvm@20/lib/c++ -L/opt/homebrew/opt/llvm@20/lib/unwind -Wl,-rpath,/opt/homebrew/opt/llvm@20/lib/c++ -Wl,-rpath,/opt/homebrew/opt/llvm@20/lib/unwind -lunwind"
          bash source-dist/source/cmake/build-wheel-macos.sh
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3):$(brew --prefix curl)" >> $GITHUB_ENV
          printf '%s\n' "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" \
            "CC=$CC" "CXX=$CXX" "CXXFLAGS=$CXXFLAGS" "LDFLAGS=$LDFLAGS" >> $GITHUB_ENV
      - name: Activate MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare the vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        shell: pwsh
        run: |
          $archives = Join-Path $env:RUNNER_TEMP 'vcpkg-archives'
          New-Item -ItemType Directory -Force -Path $archives | Out-Null
          "archives=$archives" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "VCPKG_DEFAULT_BINARY_CACHE=$archives" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - name: Restore vcpkg binary archives (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.archives }}
          key: vcpkg-archive-${{ runner.os }}-${{ steps.vcpkg-cache.outputs.image }}-curl-openssl
          restore-keys: |
            vcpkg-archive-${{ runner.os }}-
      - name: Install SDK dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install "curl[http2,openssl]:x64-windows" openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed' }
          $root = $env:VCPKG_INSTALLATION_ROOT
          "CMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "$root/installed/x64-windows/bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      - name: Save vcpkg binary archives (Windows)
        if: runner.os == 'Windows' && steps.vcpkg-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.archives }}
          key: vcpkg-archive-${{ runner.os }}-${{ steps.vcpkg-cache.outputs.image }}-curl-openssl
      - name: Verify public SDK native archive custody
        run: python source-dist/source/scripts/verify_ci.py runtime-archive --work-dir runtime-proof --jobs auto

  # Protected OIDC publication still depends on every wheel and native lane.
  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist, runtime_portability]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: release
      url: https://pypi.org/p/neograph-engine
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
