name: Deploy Doxygen to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'include/**'
      - 'docs/**.md'
      - 'examples/**'
      - 'Doxyfile'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
      - 'scripts/ci_apt_install.sh'
  pull_request:
    branches: [master]
    paths:
      - 'include/**'
      - 'docs/**.md'
      - 'examples/**'
      - 'Doxyfile'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
      - 'scripts/ci_apt_install.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Doxygen and Graphviz
        run: bash scripts/ci_apt_install.sh doxygen graphviz
      - name: Generate versioned documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          config = Path('Doxyfile').read_text()
          Path('Doxyfile').write_text(config + f'\nPROJECT_NUMBER = "{version}"\n')
          PY
          doxygen Doxyfile
          test -s docs/api/html/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
