name: CI
# The minimum every push and pull request must pass: Linux, Windows and macOS each build and run
# the full ctest suite, and two installed-consumer checks prove the package is consumable.
# Anything heavier (sanitizers, fuzzing, benchmarks, ARM64, the full consumer matrix) lives in
# ci-extended.yml and runs nightly and on demand; packaging lives in wheels.yml.
# Documentation-only changes skip this workflow.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: neograph_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: |
          bash scripts/ci_apt_install.sh cmake build-essential libpq-dev postgresql-client \
            libsqlite3-dev libssl-dev libcurl4-openssl-dev pkg-config ccache
          python -m pip install -U pytest pydantic certifi "a2a-sdk[http-server]>=1.1,<2" \
            "agent-client-protocol==0.12.1" uvicorn
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-
      - name: Configure ccache
        run: |
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
          ccache --max-size=500M
          ccache --zero-stats
      - name: Verify full Release and both protocol persistence paths
        env:
          NEOGRAPH_TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/neograph_test
        run: python scripts/verify_ci.py native-linux --work-dir build-native --jobs auto --ccache
      - name: ccache stats
        if: always()
        run: ccache --show-stats
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: build-native/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          brew update
          brew install cmake libpq openssl@3 sqlite curl
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libpq):$(brew --prefix sqlite):$(brew --prefix openssl@3):$(brew --prefix curl)" >> $GITHUB_ENV
      - name: Verify macOS all-backend build (PG build-only)
        run: python scripts/verify_ci.py native-posix --work-dir build-native --jobs auto
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-macos
          path: build-native/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install SDK transport dependencies
        uses: ./.github/actions/windows-transport-deps
      - name: Verify DB-free native MSVC (Ninja), C ABI and full ctest
        run: python scripts/verify_ci.py native-windows --work-dir build-native --jobs auto
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-windows
          path: build-native/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # A shared and a static consumer of the lightest installed packages. The other variants
  # (Program, QuickJS, macOS, Windows) run in ci-extended.yml.
  install-consumable:
    uses: ./.github/workflows/install-consumable.yml
    with:
      matrix: >-
        [{"name":"linux-shared","os":"ubuntu-latest","args":"--shared"},
         {"name":"linux-core-static","os":"ubuntu-latest","args":"--core-only"}]
