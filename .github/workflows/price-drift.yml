name: Price drift
# Compares data/pricing/catalog.json with live price sources and fails when a
# rate drifted beyond the tolerance. It never edits the catalog: a person
# checks the official pricing page and updates the catalog in a pull request.
#
# OpenRouter and LiteLLM are public GETs and need no secret. The Vertex AI
# comparison runs only when the repository defines GCP_BILLING_API_KEY (a
# Cloud Billing Catalog API key); without it that source is skipped.
#
# It runs weekly, on demand, and when the catalog or the checker changes.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/pricing/**'
      - 'scripts/check_price_drift.py'
      - 'tests/test_price_drift.py'
      - 'tests/fixtures/pricing/**'
      - '.github/workflows/price-drift.yml'

permissions:
  contents: read

concurrency:
  group: price-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checker unit tests (recorded fixtures, no network)
        run: python tests/test_price_drift.py
      - name: Compare the catalog with live sources
        shell: bash
        env:
          GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}
        run: |
          set +e
          python scripts/check_price_drift.py --json-out price-drift.json > price-drift.txt
          status=$?
          set -e
          cat price-drift.txt
          { echo '```'; cat price-drift.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-drift-report
          path: |
            price-drift.json
            price-drift.txt
          if-no-files-found: ignore
