version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/benchmarks/concurrent"
      - "/examples/26_postgres_react_hitl"
      - "/examples/cookbook/jarvis/bench"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directories:
      - "/examples/26_postgres_react_hitl"
      - "/tests/fixtures/q7-postgres"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
