\* Every graph with at most three nodes (any_of partitions included), plus the
\* named #357 graphs. See README.md for how to run TLC.
CONSTANTS
    MaxNodes = 3
    MaxCond = 2
    MaxSteps = 8
    AnyOf = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoDoubleFirePerRound
    JoinRunsOnlyWhenFired
    FireClearsSignals
    StallImpliesFailed
    OnlyExplicitEndSuppressesStall
    FailedOnlyOnStall
    LeftoverAlternativeStalls
    NamedOutcomes
    LegacyEquivalence

PROPERTIES
    Termination
